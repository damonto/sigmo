name: Verify Pro API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pro-api/**"
      - "internal/pkg/apierror/**"
      - "scripts/sync-http-contract.py"
      - "apps/ios/Sigmo/Resources/HTTPProblems.json"
      - "apps/ios/SigmoTests/Fixtures/HTTPProblems.json"
      - ".github/workflows/pro-api.yml"
  pull_request:
    branches: [main]
    paths:
      - "pro-api/**"
      - "internal/pkg/apierror/**"
      - "scripts/sync-http-contract.py"
      - "apps/ios/Sigmo/Resources/HTTPProblems.json"
      - "apps/ios/SigmoTests/Fixtures/HTTPProblems.json"
      - ".github/workflows/pro-api.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pro-api
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: python3 ../scripts/sync-http-contract.py --check
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run type-check
      - run: bun run test
      - run: bun run dry-run
