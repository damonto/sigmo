name: Build and Release Sigmo

on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild Dev even when no release files have changed
        type: boolean
        default: false
  schedule:
    # 00:00 UTC.
    - cron: "0 0 * * *"
  push:
    branches: [main]
    tags: [v*]
    paths-ignore:
      - "**/*.md"
      - "apps/ios/**"
      - "api/**"

  pull_request:
    branches: [main]
    paths-ignore:
      - "apps/ios/**"
      - "api/**"

permissions:
  contents: read

concurrency:
  group: sigmo-${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch')) && github.ref || (github.ref_type == 'tag' && 'stable' || 'dev') }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch') }}

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.release.outputs.channel }}
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.publish }}
      targets: ${{ steps.release.outputs.targets }}
      should_build: ${{ steps.changes.outputs.should_build }}
    steps:
      - id: release
        run: |
          publish=false
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "channel=stable" >> "${GITHUB_OUTPUT}"
            echo "version=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
            publish=true
          else
            echo "channel=dev" >> "${GITHUB_OUTPUT}"
            echo "version=dev-${GITHUB_SHA::8}" >> "${GITHUB_OUTPUT}"
            if [[ "${GITHUB_EVENT_NAME}" == "schedule" || "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
              publish=true
            fi
          fi
          targets='["linux-amd64"]'
          if [[ "${publish}" == "true" ]]; then
            targets='["linux-amd64","linux-amd64-musl","linux-arm64","linux-arm64-musl","linux-arm","linux-arm-musl","linux-386","linux-ppc64le","linux-riscv64","linux-s390x"]'
          fi
          echo "publish=${publish}" >> "${GITHUB_OUTPUT}"
          echo "targets=${targets}" >> "${GITHUB_OUTPUT}"
      - uses: actions/checkout@v7
        if: steps.release.outputs.channel == 'dev' && steps.release.outputs.publish == 'true' && !inputs.force
        with: { fetch-depth: 0 }
      - name: Check changes since the published Dev release
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ steps.release.outputs.channel }}
          PUBLISH: ${{ steps.release.outputs.publish }}
          FORCE: ${{ inputs.force }}
        run: |
          should_build=true
          if [[ "${CHANNEL}" == "dev" && "${PUBLISH}" == "true" && "${FORCE}" != "true" ]]; then
            release_file="${RUNNER_TEMP}/dev-release.json"
            status=$(curl --silent --show-error --output "${release_file}" --write-out '%{http_code}' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/dev")
            case "${status}" in
              200)
                # Use the published manifest; the moving tag may precede a failed release.
                manifest_url=$(jq -er '.assets[] | select(.name == "sigmo-update.json") | .url' "${release_file}")
                previous_commit=$(gh api --header 'Accept: application/octet-stream' "${manifest_url}" \
                  | jq -er '.commit | select(test("^[0-9a-f]{40}$"))')
                if ! git cat-file -e "${previous_commit}^{commit}"; then
                  git fetch --no-tags origin "${previous_commit}"
                fi
                git diff --name-only "${previous_commit}" "${GITHUB_SHA}" -- \
                  . ':(exclude,glob)**/*.md' ':(exclude,glob)apps/ios/**' ':(exclude,glob)api/**' \
                  > "${RUNNER_TEMP}/dev-changes.txt"
                if [[ ! -s "${RUNNER_TEMP}/dev-changes.txt" ]]; then
                  should_build=false
                  echo "No release files have changed since ${previous_commit}; skipping Dev release."
                fi
                ;;
              404)
                echo "No Dev release exists yet; building the first release."
                ;;
              *)
                echo "Cannot check the published Dev release: HTTP ${status}" >&2
                exit 1
                ;;
            esac
          fi
          echo "should_build=${should_build}" >> "${GITHUB_OUTPUT}"

  frontend:
    needs: metadata
    if: needs.metadata.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: |
          cd apps/web
          bun install --frozen-lockfile
          bun run build --mode prod
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist/**
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.target }}
    needs: [metadata, frontend]
    if: needs.metadata.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.metadata.outputs.targets) }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v8
        with: { name: web-dist, path: apps/web/dist }
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
      - name: Build once for target
        env:
          SIGMO_DISTRIBUTION: ${{ needs.metadata.outputs.publish == 'true' && 'standalone' || 'developer' }}
          SIGMO_BUILD_DIR: build/releases
          SIGMO_TARGETS: ${{ matrix.target }}
          SIGMO_SKIP_FRONTEND_BUILD: "1"
          SIGMO_BUILD_VERSION: ${{ needs.metadata.outputs.version }}
          SIGMO_BUILD_CHANNEL: ${{ needs.metadata.outputs.channel }}
          SIGMO_BUILD_COMMIT: ${{ github.sha }}
          SIGMO_RELEASE_PUBLIC_KEY: ${{ secrets.SIGMO_RELEASE_PUBLIC_KEY }}
          SIGMO_LICENSE_PUBLIC_KEY: ${{ secrets.SIGMO_LICENSE_PUBLIC_KEY }}
          SIGMO_WORKER_URL: ${{ vars.SIGMO_WORKER_URL }}
          SIGMO_PUSH_GATEWAY_URL: ${{ vars.SIGMO_PUSH_GATEWAY_URL }}
        run: scripts/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: sigmo-${{ matrix.target }}
          path: build/releases/sigmo-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    permissions: { contents: write }
    if: needs.metadata.outputs.publish == 'true'
    name: Publish Sigmo ${{ needs.metadata.outputs.channel }}
    needs: [metadata, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - uses: actions/download-artifact@v8
        with:
          pattern: sigmo-*
          merge-multiple: true
      - name: Compress artifacts
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(sigmo-linux-*)
          if [ "${#artifacts[@]}" -eq 0 ]; then
            echo "no artifacts found" >&2
            exit 1
          fi
          for artifact in "${artifacts[@]}"; do
            gzip -9 -n "${artifact}"
          done
      - name: Generate signed manifest
        env:
          SIGMO_RELEASE_PRIVATE_KEY: ${{ secrets.SIGMO_RELEASE_PRIVATE_KEY }}
          CHANNEL: ${{ needs.metadata.outputs.channel }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          git log -1 --pretty=%B > release-notes.txt
          args=()
          for artifact in sigmo-linux-*.gz; do
            target="${artifact#sigmo-}"
            args+=(-artifact "${target%.gz}=${artifact}")
          done
          go run ./cmd/updatemanifest \
            -channel "${CHANNEL}" -version "${VERSION}" -commit "${GITHUB_SHA}" \
            -notes-file release-notes.txt -output sigmo-update.json -compression gzip "${args[@]}"
      - name: Upload immutable release and switch latest
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SIGMO_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SIGMO_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          SIGMO_R2_ACCOUNT_ID: ${{ secrets.SIGMO_R2_ACCOUNT_ID }}
          SIGMO_R2_BUCKET: sigmo
          CHANNEL: ${{ needs.metadata.outputs.channel }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          : "${SIGMO_R2_ACCOUNT_ID:?SIGMO_R2_ACCOUNT_ID is required}"
          : "${SIGMO_R2_BUCKET:?SIGMO_R2_BUCKET is required}"
          endpoint="https://${SIGMO_R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          prefix="${CHANNEL}/versions/${VERSION}"
          artifacts=(sigmo-linux-*.gz)
          if [ "${#artifacts[@]}" -eq 0 ]; then
            echo "no artifacts found" >&2
            exit 1
          fi
          for artifact in "${artifacts[@]}"; do
            aws s3api put-object --endpoint-url "${endpoint}" --bucket "${SIGMO_R2_BUCKET}" \
              --key "${prefix}/${artifact}" --body "${artifact}" --content-type application/gzip
          done
          aws s3api put-object --endpoint-url "${endpoint}" --bucket "${SIGMO_R2_BUCKET}" \
            --key "${prefix}/manifest.json" --body sigmo-update.json --content-type application/json
          aws s3api put-object --endpoint-url "${endpoint}" --bucket "${SIGMO_R2_BUCKET}" \
            --key "${prefix}/manifest.json.sig" --body sigmo-update.json.sig --content-type text/plain
          aws s3api put-object --endpoint-url "${endpoint}" --bucket "${SIGMO_R2_BUCKET}" \
            --key "${CHANNEL}/latest/manifest.json" --body sigmo-update.json --content-type application/json
      - name: Move development tag
        if: needs.metadata.outputs.channel == 'dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/dev" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/dev" -f sha="${GITHUB_SHA}" -F force=true
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref=refs/tags/dev -f sha="${GITHUB_SHA}"
          fi
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.metadata.outputs.channel == 'dev' && 'dev' || needs.metadata.outputs.version }}
          name: ${{ needs.metadata.outputs.version }}
          prerelease: ${{ needs.metadata.outputs.channel == 'dev' }}
          make_latest: ${{ needs.metadata.outputs.channel == 'stable' }}
          generate_release_notes: true
          files: |
            sigmo-linux-*.gz
            sigmo-update.json
            sigmo-update.json.sig
